# Requires an ingress controller (minikube: `minikube addons enable ingress`;
# EKS: install ingress-nginx or AWS Load Balancer Controller).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: expense-ingress, namespace: expense-app }
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - { path: /api/users,    pathType: Prefix, backend: { service: { name: user-service,    port: { number: 5001 } } } }
          - { path: /api/expenses, pathType: Prefix, backend: { service: { name: expense-service, port: { number: 5002 } } } }
          - { path: /,             pathType: Prefix, backend: { service: { name: frontend,        port: { number: 80 } } } }
