# Example only. In real use create this with:
# kubectl -n expense-app create secret generic app-secrets \
#   --from-literal=DATABASE_URL='postgresql://app:<pw>@<rds-endpoint>:5432/expenses?sslmode=require' \
#   --from-literal=JWT_SECRET="$(openssl rand -hex 32)"
apiVersion: v1
kind: Secret
metadata: { name: app-secrets, namespace: expense-app }
type: Opaque
stringData:
  DATABASE_URL: "postgresql://app:CHANGE_ME@CHANGE_ME:5432/expenses?sslmode=require"
  JWT_SECRET: "CHANGE_ME"
