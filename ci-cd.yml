name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

permissions:
  id-token: write   # OIDC to AWS
  contents: read

env:
  AWS_REGION: ap-south-1
  PROJECT: cloudops-dev

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [user-service, expense-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - name: Install & unit/integration tests
        working-directory: services/${{ matrix.service }}
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          pytest -q
      - name: Lint
        run: pip install flake8 && flake8 services lambda ml --max-line-length 130

  build-push:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: vars
        run: echo "tag=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build, scan and push images
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          for svc in user-service expense-service; do
            docker build -t $REGISTRY/$PROJECT/$svc:$TAG services/$svc
            docker push $REGISTRY/$PROJECT/$svc:$TAG
          done
          docker build -t $REGISTRY/$PROJECT/frontend:$TAG frontend
          docker push $REGISTRY/$PROJECT/frontend:$TAG
      - name: Trivy vulnerability scan (report only)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "0"

  deploy-lambda:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Update Lambda code
        run: |
          (cd lambda/api_handler && zip -qr ../api.zip .)
          aws lambda update-function-code --function-name $PROJECT-api --zip-file fileb://lambda/api.zip

  deploy-k8s:
    needs: build-push
    if: vars.EKS_CLUSTER != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Deploy to EKS
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ needs.build-push.outputs.tag }}
        run: |
          aws eks update-kubeconfig --name ${{ vars.EKS_CLUSTER }} --region $AWS_REGION
          sed -i "s#ECR_REGISTRY/#$REGISTRY/$PROJECT/#" k8s/*.yaml
          kubectl apply -k k8s
          for d in user-service expense-service frontend; do
            kubectl -n expense-app set image deploy/$d $d=$REGISTRY/$PROJECT/$d:$TAG
            kubectl -n expense-app rollout status deploy/$d --timeout=180s
          done
