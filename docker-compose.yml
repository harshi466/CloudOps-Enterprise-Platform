services:
  db:
    image: postgres:15-alpine
    environment: { POSTGRES_DB: expenses, POSTGRES_USER: app, POSTGRES_PASSWORD: localpass }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U app -d expenses"], interval: 5s, retries: 10 }
  user-service:
    build: ./services/user-service
    environment: &env
      DATABASE_URL: postgresql://app:localpass@db:5432/expenses
      JWT_SECRET: local-dev-secret
    depends_on: { db: { condition: service_healthy } }
  expense-service:
    build: ./services/expense-service
    environment: *env
    depends_on: { db: { condition: service_healthy } }
  frontend:
    build: ./frontend
    ports: ["8080:8080"]
    depends_on: [user-service, expense-service]
volumes:
  pgdata:
