apiVersion: apps/v1
kind: Deployment
metadata: { name: frontend, namespace: expense-app, labels: { app: frontend } }
spec:
  replicas: 2
  selector: { matchLabels: { app: frontend } }
  template:
    metadata: { labels: { app: frontend } }
    spec:
      containers:
        - name: frontend
          image: ECR_REGISTRY/frontend:latest
          imagePullPolicy: IfNotPresent
          env: [{ name: DNS_RESOLVER, value: "kube-dns.kube-system.svc.cluster.local" }]
          ports: [{ containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /health, port: 8080 } }
          resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { cpu: 200m, memory: 128Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: frontend, namespace: expense-app }
spec:
  selector: { app: frontend }
  ports: [{ port: 80, targetPort: 8080 }]
